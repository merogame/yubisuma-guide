<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101113">
<title>指スマガイド</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:#101113;color:#f5f5f5;touch-action:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
main{position:relative;width:min(100%,28rem);height:100%;height:100dvh;margin:auto}
button{padding:0;border:1px solid #3c3e43;border-radius:.6rem;background:#222429;color:inherit;font:600 1.25rem/1.2 system-ui,-apple-system,"Yu Gothic",sans-serif;touch-action:none;cursor:pointer}
button:active:not(:disabled){background:#3c3e43}
button:disabled{color:#62656b;background:#191a1d;border-color:#25272b;cursor:default}
button:focus-visible,#move:focus-visible{outline:2px solid #f8e24b;outline-offset:2px}
#setup{position:absolute;left:1rem;right:1rem;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
#setup button{height:clamp(3.5rem,18dvh,5rem);font-size:1.5rem}
.remaining{position:absolute;left:2.5rem;right:2.5rem;top:max(1rem,env(safe-area-inset-top));display:grid;grid-template-columns:1fr 1fr;gap:1rem;text-align:center}
.remaining span{display:block;color:#a6a8ad;font-size:1rem;line-height:1.2}
.remaining output{display:block;margin-top:.25rem;font-size:clamp(2rem,10vmin,3rem);font-weight:600;line-height:1.2}
.center{position:absolute;left:1rem;right:1rem;top:50%;transform:translateY(-50%);text-align:center}
#action{display:block;margin-bottom:.5rem;color:#a6a8ad;font-size:1rem;line-height:1.2}
#move{display:block;color:#f8e24b;font-size:clamp(2.5rem,18vmin,5rem);font-weight:700;line-height:1.3;white-space:nowrap}
#move[role=button]{cursor:pointer}
#move.result{font-size:clamp(1.75rem,11vmin,3.5rem)}
#choices{position:absolute;left:max(1rem,env(safe-area-inset-left));right:max(1rem,env(safe-area-inset-right));bottom:max(1rem,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
#choices button{height:clamp(3.25rem,14dvh,5.5rem);font-size:clamp(1.5rem,8vmin,2rem)}
#undo{position:absolute;top:max(.5rem,env(safe-area-inset-top));right:max(.75rem,env(safe-area-inset-right));width:2rem;height:2rem;border:0;background:transparent;font-size:1.5rem}
@media(max-height:350px){.remaining{top:max(.5rem,env(safe-area-inset-top))}.remaining span{font-size:.875rem}.remaining output{font-size:1.75rem;margin-top:.125rem}#action{font-size:.875rem;margin-bottom:.25rem}#move{font-size:2.5rem;line-height:1.1}#move.result{font-size:1.75rem}#choices{bottom:max(.5rem,env(safe-area-inset-bottom))}#choices button{height:2.75rem}#undo{top:max(.25rem,env(safe-area-inset-top));height:1.5rem;font-size:1.25rem}}
</style>
<main>
<div id="setup"><button type="button" data-parent="1">先手</button><button type="button" data-parent="0">後手</button></div>
<section id="game" hidden>
<div class="remaining"><div><span>相手</span><output id="opponent" aria-label="相手の残り本数"></output></div><div><span>自分</span><output id="own" aria-label="自分の残り本数"></output></div></div>
<div class="center"><span id="action"></span><output id="move" aria-live="polite"></output></div>
<div id="choices" role="group" aria-label="相手の行動"><button type="button" data-value="0">0</button><button type="button" data-value="1">1</button><button type="button" data-value="2">2</button></div>
<button id="undo" type="button" aria-label="最初の画面へ">↶</button>
</section>
</main>
<script>
function limit(state){return state.parent?state.other:state.own}
function randomBelow(n){const random=new Uint32Array(1),cutoff=4294967296-4294967296%n;do{crypto.getRandomValues(random)}while(random[0]>=cutoff);return random[0]%n}
function recommend(state){return randomBelow(limit(state)+1)}
function advance(state,other){
  if(!Number.isInteger(other)||other<0||other>limit(state)||state.own<1||state.other<1)throw Error('Illegal action');
  const next={...state};
  if(state.chosen===other){if(state.parent)next.own--;else next.other--}
  return next;
}
const setup=document.getElementById('setup'),game=document.getElementById('game'),own=document.getElementById('own'),opponent=document.getElementById('opponent'),action=document.getElementById('action'),move=document.getElementById('move'),choices=document.getElementById('choices'),buttons=[...choices.children],undo=document.getElementById('undo');
let state=null,history=[],finished=false;
function render(){
  const max=limit(state);
  own.textContent=state.own;opponent.textContent=state.other;
  action.hidden=finished;action.textContent=state.parent?'親・指定':'子・上げる';
  move.textContent=finished?(state.own===0?'勝ち':'負け'):state.chosen;move.classList.toggle('result',finished);
  if(finished){move.setAttribute('role','button');move.tabIndex=0;move.setAttribute('aria-label',move.textContent+'。最初の画面へ')}
  else{move.removeAttribute('role');move.removeAttribute('tabindex');move.setAttribute('aria-label',state.parent?'推奨行動：'+state.chosen+'を指定':'推奨行動：'+state.chosen+'本上げる')}
  choices.setAttribute('aria-label',state.parent?'相手が上げた本数':'相手が指定した数字');choices.style.gridTemplateColumns='repeat('+(max+1)+',minmax(0,1fr))';
  buttons.forEach((button,value)=>{button.hidden=value>max;button.disabled=finished;button.setAttribute('aria-label',state.parent?'相手が'+value+'本上げた':'相手が'+value+'を指定')});
  undo.setAttribute('aria-label',history.length?'1回戻す':'最初の画面へ');
}
function draw(){state.chosen=recommend(state);finished=false;render()}
function start(parent){state={own:2,other:2,parent,chosen:0};history=[];setup.hidden=true;game.hidden=false;draw()}
function reset(){state=null;history=[];finished=false;game.hidden=true;setup.hidden=false}
function play(other){
  if(!state||finished||other<0||other>limit(state))return;
  history.push({...state});if(history.length>128)history.shift();
  state=advance(state,other);
  if(state.own===0||state.other===0){finished=true;render();return}
  state.parent=!state.parent;draw();
}
function restart(){if(finished)reset()}
document.querySelectorAll('[data-parent]').forEach(button=>button.addEventListener('click',()=>start(button.dataset.parent==='1')));
buttons.forEach((button,value)=>button.addEventListener('click',()=>play(value)));
move.addEventListener('click',restart);
move.addEventListener('keydown',event=>{if(finished&&(event.key==='Enter'||event.key===' ')){event.preventDefault();restart()}});
undo.addEventListener('click',()=>{if(history.length){state=history.pop();finished=false;render()}else reset()});
for(const name of ['touchmove','wheel','gesturestart','gesturechange','gestureend','dblclick'])document.addEventListener(name,event=>event.preventDefault(),{passive:false});
document.addEventListener('touchstart',event=>{if(event.touches.length>1)event.preventDefault()},{passive:false});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&['+','=','-','_','0','Add','Subtract'].includes(event.key))event.preventDefault()});
</script>
</html>
